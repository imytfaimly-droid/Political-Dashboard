name: Hourly Uttarakhand Political Monitor

on:
  schedule:
    # Runs every 1 hour (24/7 in cloud even if laptop is off)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

permissions:
  contents: write

jobs:
  scrape-and-alert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Political Monitor & Send Alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8854016391:AAEI14VTuDTgfyPDSOsDd_pPOYxVqBl7Ydk' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '6021382294' }}
        run: |
          if [ -f "monitor.py" ]; then
            python monitor.py
          elif [ -f "Uttarakhand_Political_Monitor/monitor.py" ]; then
            cd Uttarakhand_Political_Monitor
            python monitor.py
          else
            echo "Searching for monitor.py..."
            find . -name "monitor.py"
            exit 1
          fi

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Auto-update political feed [skip ci]" && git push)
