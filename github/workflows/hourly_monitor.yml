name: Hourly Uttarakhand Political Monitor

on:
  schedule:
    # Runs every 1 hour (24/7 in cloud even if laptop is off)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  scrape-and-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Political Monitor & Send Alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8854016391:AAEI14VTuDTgfyPDSOsDd_pPOYxVqBl7Ydk' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '6021382294' }}
        run: |
          python monitor.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "Political-Monitor-Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add data.json initial_data.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update political feed [skip ci]" && git push)
